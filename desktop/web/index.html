<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piwpi</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./vendor/hljs-github.min.css">
</head>
<body>
<div id="app">

  <!-- ===== 左侧栏 ===== -->
  <aside class="sidebar">
    <div class="logo-row"><img src="./assets/pwp-logo.png" alt="piwpi"></div>
    <button class="btn-newchat" id="btnNewChat">
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M6 1v10M1 6h10" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>新建对话</span>
    </button>
    <button class="nav-row" id="navProject" title="当前项目目录，点击切换">
      <span id="projectName">—</span><span class="soon">切换</span>
    </button>
    <div class="session-tree" id="sessionTree"></div>
    <div class="side-spacer"></div>
    <button class="nav-row" id="navMap"><span>Project Map</span></button>
    <div class="side-fill"></div>
    <div class="side-status">
      <div class="status-row"><span class="status-dot" id="piDot"></span><span id="piStatus">连接中…</span></div>
      <div class="status-model" id="modelName">—</div>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <main class="main">
    <div class="topbar">
      <div class="crumb" id="sessionTitle">piwpi / 新对话</div>
      <button class="ctx-btn" id="btnContext">
        <span class="ctx-label">Context</span><span class="ctx-badge" id="ctxBadge">0</span>
      </button>
    </div>

    <div class="chat-flow" id="chatFlow">
      <div class="msg-col" id="msgCol">
        <div class="empty-hint" id="emptyHint">
          <div class="empty-title">开始一段对话</div>
          <div class="empty-sub">piwpi 会把工具读取的文件挂载进上下文，右侧 Context 可实时查看。</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-card">
        <textarea id="inputBox" rows="1" placeholder="给 piwpi 发送消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="input-tools">
          <label class="thinking-picker" title="思考强度">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1a4 4 0 0 1 4 4c0 1.5-.8 2.4-1.5 3.2-.5.6-.5 1.3-.5 1.8H5c0-.5 0-1.2-.5-1.8C3.8 7.4 3 6.5 3 5a4 4 0 0 1 4-4Z" stroke="#74767C" stroke-width="1.2" stroke-linejoin="round"/><path d="M5.5 12h3M6 13.5h2" stroke="#74767C" stroke-width="1.2" stroke-linecap="round"/></svg>
            <select id="thinkingSel" disabled><option>…</option></select>
          </label>
          <button class="ctx-ring-btn" id="btnCtxRing" title="上下文分布" aria-expanded="false">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <circle class="ring-track" cx="9" cy="9" r="7"/>
              <circle class="ring-progress" cx="9" cy="9" r="7" transform="rotate(-90 9 9)"/>
            </svg>
          </button>
          <div class="ctx-popover" id="ctxPopover" hidden>
            <div class="ctx-pop-head">
              <span class="ctx-pop-title">上下文分布</span>
              <span class="est-tag">估算值</span>
              <button class="icon-btn" id="btnCtxClose" title="关闭">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="#74767C" stroke-width="1.5" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div id="ctxDonut"></div>
            <div class="ctx-legend" id="ctxLegend"></div>
            <div class="ctx-pop-foot" id="ctxFoot"></div>
          </div>
          <button class="action-btn" id="btnAction" title="发送">
            <svg class="icon-send" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-abort" width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="#FFFFFF"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== Project Map 页面（数据源：/debug/project-map + /debug/state.cwd） ===== -->
    <div class="page page-map" id="mapPage" hidden>
      <div class="page-pad-sm">
        <div class="page-title">Project Map</div>
        <div class="page-sub">记忆 Agent 逐步建立的项目理解</div>
        <div class="body-row">
          <div class="tree-card" id="mapTree"></div>
          <div class="detail-card map-detail" id="mapDetail"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Context 抽屉 ===== -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <span class="drawer-title">Current Context</span>
    </div>

    <div class="drawer-scroll">
      <div class="drawer-label">已挂载文件 <span class="drawer-count" id="fileCount">0</span></div>
      <div id="fileList" class="drawer-group"><div class="drawer-empty">暂无挂载</div></div>

      <div class="drawer-label">上下文消息 <span class="drawer-count" id="msgCount">0</span></div>
      <div class="drawer-meta" id="ctxMeta">等待第一次 LLM 请求…</div>
      <div id="ctxList" class="drawer-group"></div>

      <div class="drawer-label">实时事件</div>
      <div id="eventList" class="drawer-group event-log"></div>
    </div>
  </aside>

</div>

<div class="banner" id="banner" hidden></div>
<div class="toast-stack" id="toasts"></div>

<script src="./vendor/markdown-it.min.js"></script>
<script src="./vendor/hljs.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
