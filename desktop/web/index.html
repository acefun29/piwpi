<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>piwpi</title>
<link rel="stylesheet" href="./styles.css">
<link rel="stylesheet" href="./vendor/hljs-github.min.css">
</head>
<body>
<div class="window-titlebar" aria-hidden="true"></div>
<div id="app">

  <!-- ===== 左侧栏 ===== -->
  <aside class="sidebar">
    <div class="logo-row"><img src="/logo.svg" alt="piwpi"></div>
    <button class="btn-newchat" id="btnNewChat">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M9.5 2.5H4A1.5 1.5 0 0 0 2.5 4v8A1.5 1.5 0 0 0 4 13.5h8a1.5 1.5 0 0 0 1.5-1.5V6.5" stroke="currentColor" stroke-width="1.35" stroke-linecap="round"/><path d="m7 9 1.1-2.7L12 2.5l1.5 1.5-3.8 3.9L7 9Z" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>新建对话</span>
    </button>
    <button class="nav-row" id="navMap">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h4l1.2 1.4h5.8v6.6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-8Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M2.5 6h11" stroke="currentColor" stroke-width="1.35"/></svg>
      <span>项目地图</span>
    </button>
    <button class="nav-row" id="navProviders">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2.5h8v11H4v-11Z" stroke="currentColor" stroke-width="1.3"/><path d="M6 5h4M6 8h4M6 11h2.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
      <span>模型供应商</span>
    </button>
    <div class="projects-head">
      <span>项目</span>
      <button id="navProject" class="project-switch" title="切换项目目录">切换</button>
    </div>
    <div class="session-tree" id="sessionTree"></div>
    <div class="side-status">
      <div class="status-row"><span class="status-dot" id="piDot"></span><span id="piStatus">连接中…</span></div>
      <div class="status-model" id="modelName">—</div>
    </div>
  </aside>

  <!-- ===== 主区 ===== -->
  <main class="main">
    <div class="topbar">
      <div class="crumb" id="sessionTitle">piwpi / 新对话</div>
      <button class="ctx-btn" id="btnContext">
        <span class="ctx-label">上下文</span><span class="ctx-badge" id="ctxBadge">0</span>
      </button>
    </div>

    <div class="chat-flow" id="chatFlow">
      <div class="msg-col" id="msgCol">
        <div class="empty-hint" id="emptyHint">
          <div class="empty-title">开始一段对话</div>
          <div class="empty-sub">piwpi 会把工具读取的文件挂载进上下文，右侧上下文可实时查看。</div>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-card">
        <textarea id="inputBox" rows="1" placeholder="给 piwpi 发送消息…（Enter 发送，Shift+Enter 换行）"></textarea>
        <div class="model-menu" id="modelMenu" hidden>
          <input id="modelSearch" type="search" placeholder="搜索模型…" autocomplete="off">
          <div id="modelList" class="model-list"></div>
          <button id="modelManage" class="model-manage" type="button">管理模型供应商</button>
        </div>
        <div class="input-tools">
          <button class="model-picker-btn" id="modelPickerBtn" type="button" title="选择模型">未选择模型</button>
          <label class="mode-picker" title="协作模式">
            <select id="modeSel" disabled>
              <option value="default">默认</option>
              <option value="plan">计划</option>
            </select>
          </label>
          <label class="thinking-picker" title="思考强度">
            <svg width="13" height="13" viewBox="0 0 14 14" fill="none"><path d="M7 1a4 4 0 0 1 4 4c0 1.5-.8 2.4-1.5 3.2-.5.6-.5 1.3-.5 1.8H5c0-.5 0-1.2-.5-1.8C3.8 7.4 3 6.5 3 5a4 4 0 0 1 4-4Z" stroke="#74767C" stroke-width="1.2" stroke-linejoin="round"/><path d="M5.5 12h3M6 13.5h2" stroke="#74767C" stroke-width="1.2" stroke-linecap="round"/></svg>
            <select id="thinkingSel" disabled><option>…</option></select>
          </label>
          <button class="action-btn" id="btnAction" title="发送">
            <svg class="icon-send" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <svg class="icon-abort" width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="2" width="8" height="8" rx="1.5" fill="#FFFFFF"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- ===== Project Map 页面（数据源：/debug/project-map + /debug/state.cwd） ===== -->
    <div class="page page-map" id="mapPage" hidden>
      <div class="page-pad-sm">
        <div class="page-title">项目地图</div>
        <div class="page-sub">记忆模块逐步建立的项目理解</div>
        <div class="map-body" id="mapBody">
          <div class="map-picker collapsed" id="mapPicker">
            <div class="picker-head" id="pickerHead">
              <span class="picker-folder">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2.5 4.5h4l1.2 1.4h5.8v6.6a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1v-8Z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/><path d="M2.5 6h11" stroke="currentColor" stroke-width="1.35"/></svg>
              </span>
              <span class="picker-current" id="pickerCurrent">选择一个文件</span>
              <span class="picker-chev">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4.5 3L7.5 6L4.5 9" stroke="#A2A3A8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </span>
            </div>
            <div class="picker-body" id="pickerBody">
              <input class="picker-search" id="pickerSearch" type="text" placeholder="搜索文件…" autocomplete="off">
              <div class="picker-tree" id="pickerTree"></div>
            </div>
          </div>
          <div class="detail-card map-detail" id="mapDetail"></div>
        </div>
      </div>
    </div>

    <div class="page page-providers" id="providersPage" hidden>
      <div class="provider-page-pad">
        <div class="provider-page-head">
          <div><div class="page-title">模型供应商</div><div class="page-sub">配置内置供应商，或通过兼容接口接入其他服务。</div></div>
          <button id="addCustomProvider" class="primary-btn" type="button">添加自定义供应商</button>
        </div>
        <div class="provider-layout">
          <aside class="provider-list" id="providerList"></aside>
          <section class="provider-detail" id="providerDetail"></section>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== Context 抽屉 ===== -->
  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-head">
      <div class="drawer-heading">
        <span class="drawer-title">上下文</span>
        <span class="drawer-kicker">上下文监控</span>
      </div>
      <span class="drawer-live" id="ctxUsageState">等待数据</span>
    </div>

    <div class="drawer-scroll">
      <section class="ctx-usage-section">
        <div class="ctx-section-head">
          <div class="drawer-label">上下文占用</div>
          <button class="ctx-section-link" id="ctxChartOpen" type="button">查看图表</button>
        </div>
        <button class="ctx-usage-summary" id="ctxUsageSummary" type="button" title="查看上下文占用详情">
          <div class="ctx-gauge-wrap">
            <svg id="ctxGauge" viewBox="0 0 120 120" aria-label="上下文占用率">
              <circle class="ctx-gauge-track" cx="60" cy="60" r="48"/>
              <circle class="ctx-gauge-progress" id="ctxGaugeProgress" cx="60" cy="60" r="48"/>
              <text id="ctxGaugePct" class="ctx-gauge-pct" x="60" y="57">—</text>
              <text class="ctx-gauge-caption" x="60" y="73">已用</text>
            </svg>
          </div>
          <div class="ctx-stat-grid">
            <div class="ctx-stat"><span class="ctx-stat-value" id="ctxUsedTokens">—</span><span class="ctx-stat-label">已使用</span></div>
            <div class="ctx-stat"><span class="ctx-stat-value" id="ctxWindowTokens">—</span><span class="ctx-stat-label">窗口</span></div>
            <div class="ctx-stat"><span class="ctx-stat-value" id="ctxMessageStat">0</span><span class="ctx-stat-label">消息</span></div>
            <div class="ctx-stat"><span class="ctx-stat-value" id="ctxToolStat">0</span><span class="ctx-stat-label">工具输出</span></div>
          </div>
        </button>
      </section>

      <section class="ctx-entry-section">
        <div class="ctx-section-head">
          <div class="drawer-label">上下文消息 <span class="drawer-count" id="msgCount">0</span></div>
          <span class="ctx-section-code">完整文本</span>
        </div>
        <button class="ctx-all-entry" id="ctxOpenAll" type="button">
          <span class="ctx-entry-icon">{ }</span>
          <span class="ctx-entry-copy"><strong>查看全部上下文</strong><small id="ctxMeta">等待首次请求…</small></span>
          <span class="ctx-entry-arrow">↗</span>
        </button>
      </section>

      <section class="ctx-files-section">
        <div class="ctx-section-head">
          <div class="drawer-label">已挂载文件 <span class="drawer-count" id="fileCount">0</span></div>
          <span class="ctx-section-code">已挂载</span>
        </div>
        <div id="fileList" class="drawer-group"><div class="drawer-empty">暂无挂载</div></div>
      </section>

    </div>

    <div class="ctx-overlay ctx-chart-detail" id="ctxChartDetail" hidden>
      <div class="ctx-overlay-head">
        <div><span class="ctx-overlay-kicker">占用详情</span><h2 id="ctxChartTitle">上下文组成</h2><p id="ctxChartSubtitle"></p></div>
        <button class="icon-btn" id="ctxChartClose" type="button" title="返回上下文" aria-label="返回上下文">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8L10 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="ctx-focus-stat"><span id="ctxChartValue">—</span><small id="ctxChartPercent">—</small></div>
      <div id="ctxChartDonut" class="ctx-chart-donut"></div>
      <div id="ctxChartLegend" class="ctx-chart-legend"></div>
      <div id="ctxChartFoot" class="ctx-chart-foot"></div>
    </div>

    <div class="ctx-overlay ctx-all-viewer" id="ctxAllViewer" hidden>
      <div class="ctx-overlay-head">
        <div><span class="ctx-overlay-kicker">完整上下文</span><h2>全部上下文</h2><p id="ctxViewerMeta">—</p></div>
        <button class="icon-btn" id="ctxViewerClose" type="button" title="返回上下文" aria-label="返回上下文">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8L10 12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <label class="ctx-viewer-search" for="ctxViewerSearch">
        <span>⌕</span><input id="ctxViewerSearch" type="search" placeholder="在上下文中查找…" autocomplete="off"><span id="ctxViewerMatch"></span>
      </label>
      <pre id="ctxAllText" class="ctx-all-text"></pre>
    </div>
  </aside>

</div>

<div class="banner" id="banner" hidden></div>
<div class="toast-stack" id="toasts"></div>

<script src="./vendor/markdown-it.min.js"></script>
<script src="./vendor/hljs.min.js"></script>
<script type="module" src="./app.js"></script>
</body>
</html>
